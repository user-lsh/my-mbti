<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">

  <style>
    * {
      box-sizing: border-box;
    }

    :root {
      --cream: #fff9e9;
      --yellow: #ffdc78;
      --yellow-dark: #f1bd43;
      --brown: #55432e;
      --white: #fffef9;
      --pink: #ffe7df;
    }

    body {
      margin: 0;
      padding: 28px 16px 40px;
      background: var(--cream);
      color: var(--brown);
      font-family:
        "Malgun Gothic", "Apple SD Gothic Neo",
        sans-serif;
      text-align: center;
    }

    .container {
      width: 100%;
      max-width: 760px;
      margin: 0 auto;
    }

    .badge {
      display: inline-block;
      padding: 8px 16px;
      background: #fff0bb;
      border: 2px solid #f6d77e;
      border-radius: 30px;
      font-size: 15px;
      font-weight: bold;
    }

    h1 {
      margin: 18px 0 12px;
      font-size: clamp(30px, 6vw, 46px);
      line-height: 1.25;
      letter-spacing: -1.5px;
    }

    .subtitle {
      margin: 0 auto 28px;
      color: #806c50;
      font-size: 17px;
      line-height: 1.8;
    }

    .panel {
      padding: 24px;
      background: var(--white);
      border: 2px solid #f4e4b8;
      border-radius: 28px;
      box-shadow: 0 8px 0 #f5e8c8;
    }

    .section-title {
      margin: 0 0 8px;
      font-size: 23px;
    }

    .hint {
      margin: 0 0 22px;
      color: #927d60;
      font-size: 15px;
    }

    .mbti-grid {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 10px;
    }

    .mbti-button {
      min-height: 56px;
      padding: 10px 4px;
      background: #fff8e5;
      border: 2px solid #f0dfb7;
      border-radius: 15px;
      color: var(--brown);
      font-size: 17px;
      font-weight: 800;
      cursor: pointer;
      transition:
        transform 0.15s,
        background 0.15s,
        border-color 0.15s;
    }

    .mbti-button:hover {
      background: #ffedb5;
      border-color: var(--yellow-dark);
      transform: translateY(-2px);
    }

    .mbti-button:focus-visible,
    .reset-button:focus-visible {
      outline: 3px solid #8c6b24;
      outline-offset: 3px;
    }

    .mbti-button.selected {
      background: var(--yellow);
      border-color: #d8a72c;
    }

    .result {
      margin-top: 30px;
      animation: appear 0.35s ease;
    }

    .result[hidden] {
      display: none;
    }

    @keyframes appear {
      from {
        opacity: 0;
        transform: translateY(10px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .result-label {
      display: inline-block;
      padding: 8px 16px;
      border-radius: 30px;
      background: #fff0bb;
      font-size: 15px;
      font-weight: bold;
    }

    .pokemon-card {
      margin-top: 16px;
      padding: 26px 20px;
      background: #fff5d8;
      border: 2px solid #f4dfa4;
      border-radius: 24px;
    }

    .pokemon-emoji {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 160px;
      height: 160px;
      margin: 0 auto 10px;
      background: #fffdf4;
      border: 3px solid #f6e6b7;
      border-radius: 50%;
      font-size: 90px;
    }

    .pokemon-name {
      margin: 12px 0 8px;
      font-size: clamp(29px, 5vw, 38px);
    }

    .pokemon-type {
      display: inline-block;
      padding: 6px 14px;
      background: #fff;
      border-radius: 20px;
      color: #8a7049;
      font-size: 14px;
      font-weight: bold;
    }

    .reason-title {
      margin: 24px 0 10px;
      font-size: 20px;
    }

    .reason {
      max-width: 500px;
      margin: 0 auto;
      font-size: 17px;
      line-height: 1.9;
      word-break: keep-all;
    }

    .compatibility {
      display: flex;
      align-items: center;
      gap: 14px;
      margin-top: 18px;
      padding: 18px;
      background: var(--pink);
      border: 2px solid #f4d0c2;
      border-radius: 20px;
      text-align: left;
    }

    .compatibility-icon {
      flex-shrink: 0;
      font-size: 37px;
    }

    .compatibility-label {
      margin: 0 0 5px;
      color: #8b6250;
      font-size: 14px;
    }

    .compatibility-type {
      margin: 0 0 5px;
      font-size: 24px;
    }

    .compatibility-description {
      margin: 0;
      font-size: 15px;
      line-height: 1.6;
      word-break: keep-all;
    }

    .reset-button {
      width: 100%;
      margin-top: 18px;
      padding: 16px;
      background: var(--yellow);
      border: 2px solid #e8c05c;
      border-radius: 16px;
      color: var(--brown);
      font-size: 18px;
      font-weight: bold;
      cursor: pointer;
      transition: background 0.15s;
    }

    .reset-button:hover {
      background: #ffd15a;
    }

    .footer {
      margin-top: 28px;
      color: #a08d70;
      font-size: 13px;
      line-height: 1.8;
    }

    @media (max-width: 420px) {
      body {
        padding: 22px 12px 30px;
      }

      .panel {
        padding: 18px 13px;
      }

      .mbti-grid {
        gap: 8px;
      }

      .mbti-button {
        min-height: 51px;
        font-size: 15px;
      }

      .pokemon-emoji {
        width: 135px;
        height: 135px;
        font-size: 76px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.01ms !important;
        transition-duration: 0.01ms !important;
      }
    }
  </style>
</head>

    const resultLabel = document.getElementById("resultLabel");
    const resultTitle = document.getElementById("resultTitle");
    const pokemonEmoji = document.getElementById("pokemonEmoji");
    const pokemonType = document.getElementById("pokemonType");
    const reason = document.getElementById("reason");
    const compatibilityType =
      document.getElementById("compatibilityType");
    const compatibilityReason =
      document.getElementById("compatibilityReason");
    const resetButton = document.getElementById("resetButton");

    // MBTI 버튼을 누르면 결과 표시
    grid.addEventListener("click", function (event) {
      const button = event.target.closest("button[data-mbti]");

      if (!button) return;

      const mbti = button.dataset.mbti;
      const data = pokemonData[mbti];

      if (!data) return;

      // 이전 선택 표시 제거
      grid.querySelectorAll(".mbti-button").forEach(function (item) {
        item.classList.remove("selected");
        item.setAttribute("aria-pressed", "false");
      });

      button.classList.add("selected");
      button.setAttribute("aria-pressed", "true");

      // 포켓몬 결과 표시
      resultLabel.textContent = "🎉 " + mbti + "의 포켓몬";
      resultTitle.textContent = data.name;
      pokemonEmoji.textContent = data.emoji;
      pokemonType.textContent = data.type;

      // 이유를 두 줄로 표시
      reason.replaceChildren();

      data.reason.forEach(function (line, index) {
        const paragraph = document.createElement("span");
        paragraph.textContent = line;
        reason.appendChild(paragraph);

        if (index < data.reason.length - 1) {
          reason.appendChild(document.createElement("br"));
        }
      });

      compatibilityType.textContent = data.match;
      compatibilityReason.textContent = data.matchReason;

      result.hidden = false;

      // 결과가 화면에 나타나도록 이동
      result.scrollIntoView({
        behavior: window.matchMedia(
          "(prefers-reduced-motion: reduce)"
        ).matches ? "auto" : "smooth",
        block: "start"
      });
    });

    // 다시 고르기: 선택을 초기화하고 버튼 영역으로 이동
    resetButton.addEventListener("click", function () {
      result.hidden = true;

      grid.querySelectorAll(".mbti-button").forEach(function (button) {
        button.classList.remove("selected");
        button.setAttribute("aria-pressed", "false");
      });

      grid.scrollIntoView({
        behavior: window.matchMedia(
          "(prefers-reduced-motion: reduce)"
        ).matches ? "auto" : "smooth",
        block: "center"
      });
    });

    // 초기 접근성 상태 설정
    grid.querySelectorAll(".mbti-button").forEach(function (button) {
      button.setAttribute("aria-pressed", "false");
    });
  </script>
</body>
</html>
